name: Ognami XLSX Guncelle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-xlsx:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Google Sheets dosyasini XLSX olarak indir
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1DnjuvTbNLzWxdWEVx4i0aQIrecPrKMmJ3cp23_t0vBo/export?format=xlsx" -o ognami.xlsx

      - name: GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ognami.xlsx
          git diff --cached --quiet || git commit -m "ognami.xlsx otomatik guncellendi"
          git push
